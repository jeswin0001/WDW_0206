<!DOCTYPE html>
<html lang="en">
<head>
    <title>Assignment 5 - Unordered, Ordered and Description Lists</title>
</head>
<body>
    <!-- Unordered list -->
    <h3>Unordered</h3>
    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ul>

    <!-- Ordered list (type A gives A, B, C) -->
    <h3>Ordered</h3>
    <ol type="A">
        <li>Install VS Code</li>
        <li>Create file</li>
        <li>Open in browser</li>
    </ol>

    <!-- Description list -->
    <h3>Description</h3>
    <dl>
        <dt>HTML</dt>
        <dd>HyperText Markup Language</dd>
        <dt>CSS</dt>
        <dd>Cascading Style Sheets</dd>
    </dl>
</body>
</html>
