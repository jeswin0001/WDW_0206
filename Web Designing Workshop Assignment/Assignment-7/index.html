<!DOCTYPE html>
<html lang="en">
<head>
    <title>Assignment 7 - Navigation Menu Using Lists</title>
    <style>
        /* Remove bullets and make the dark bar */
        ul {
            list-style-type: none;
            background-color: #333;
            margin: 0;
            padding: 0;
        }

        /* Put the list items side by side */
        li {
            display: inline-block;
        }

        /* White links, no underline */
        a {
            color: white;
            text-decoration: none;
            display: block;
            padding: 14px 20px;
        }
    </style>
</head>
<body>
    <!-- Navigation menu made from an unordered list -->
    <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Courses</a></li>
        <li><a href="#">Contact</a></li>
    </ul>
</body>
</html>
