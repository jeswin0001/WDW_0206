<!DOCTYPE html>
<html lang="en">
<head>
    <title>Assignment 15 - Form: Input Elements, Label and Fieldset</title>
</head>
<body>
    <form>
        <!-- fieldset groups related fields, legend is its title -->
        <fieldset>
            <legend>Personal Details</legend>

            <!-- Text input -->
            <p>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name">
            </p>

            <!-- Email input -->
            <p>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email">
            </p>

            <!-- Password input -->
            <p>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password">
            </p>

            <!-- Radio buttons: same name, so only one can be chosen -->
            <p>
                Gender:
                <input type="radio" id="male" name="gender" value="male">
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female">
                <label for="female">Female</label>
            </p>

            <!-- Checkboxes: many can be chosen -->
            <p>
                Hobbies:
                <input type="checkbox" id="reading" name="hobby" value="reading">
                <label for="reading">Reading</label>
                <input type="checkbox" id="coding" name="hobby" value="coding">
                <label for="coding">Coding</label>
            </p>

            <!-- Date input -->
            <p>
                <label for="dob">DOB:</label>
                <input type="date" id="dob" name="dob">
            </p>
        </fieldset>
    </form>
</body>
</html>
