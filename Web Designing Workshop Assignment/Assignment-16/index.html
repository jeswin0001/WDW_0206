<!DOCTYPE html>
<html lang="en">
<head>
    <title>Assignment 16 - Select, Textarea and Buttons</title>
</head>
<body>
    <form>
        <p>
            <label for="course">Course:</label>
            <select id="course" name="course">
                <option value="CSE">CSE</option>
                <option value="ECE" selected>ECE</option>
                <option value="ME">ME</option>
            </select>
        </p>

        <p>
            <label for="feedback">Feedback:</label><br>
            <textarea id="feedback" name="feedback" rows="5" cols="40" placeholder="Write here..."></textarea>
        </p>
    </form>
</body>
</html>
