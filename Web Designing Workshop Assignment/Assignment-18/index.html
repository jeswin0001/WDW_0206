<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABC College Admission 2026</title>
    <style>
        /* Page is centered with a fixed width */
        body {
            max-width: 700px;
            margin: 0 auto;
        }

        /* Navy header and footer with white text */
        header, footer {
            background-color: #1a237e;
            color: white;
            text-align: center;
        }

        header {
            padding: 28px 20px;
        }

        header h1 {
            margin: 0;
        }

        footer {
            padding: 10px;
        }

        footer p {
            margin: 0;
        }

        /* Space on the left and right of the main content */
        main {
            padding: 0 13%;
        }

        /* Table with light borders and lavender header */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 4px 6px;
            text-align: left;
        }

        th {
            background-color: #e8eaf6;
            text-align: center;
        }

        fieldset {
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <header>
        <h1>ABC College Admission 2026</h1>
    </header>

    <main>
        <h2>Courses and Fees</h2>

        <table>
            <caption>Available Courses</caption>
            <tr>
                <th scope="col">Course</th>
                <th scope="col">Seats</th>
                <th scope="col">Fees</th>
            </tr>
            <tr>
                <td>B.Tech CSE</td>
                <td>120</td>
                <td>&#8377;90,000</td>
            </tr>
            <tr>
                <td>BCA</td>
                <td>60</td>
                <td>&#8377;45,000</td>
            </tr>
        </table>

        <form>
            <fieldset>
                <legend>Application Form</legend>

                <p>
                    <label for="name">Name:</label><br>
                    <input type="text" id="name" name="name" required>
                </p>

                <p>
                    <label for="email">Email:</label><br>
                    <input type="email" id="email" name="email" required>
                </p>

                <p>
                    <label for="course">Course:</label><br>
                    <select id="course" name="course">
                        <option value="btech-cse">B.Tech CSE</option>
                        <option value="bca">BCA</option>
                    </select>
                </p>

                <p>
                    <label for="statement">Statement:</label><br>
                    <textarea id="statement" name="statement" rows="4" cols="50" required></textarea>
                </p>

                <button type="submit">Apply</button>
            </fieldset>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 ABC College</p>
    </footer>
</body>
</html>
