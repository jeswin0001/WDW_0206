<!DOCTYPE html>
<html lang="en">
<head>
    <title>Assignment 17 - Form Attributes and Input Validation</title>
</head>
<body>
    <form method="post" action="submit.php">
        <p>
            <input type="text" name="fullname" placeholder="Full name" required>
        </p>

        <!-- type="email" checks for an @ in the address -->
        <p>
            <input type="email" name="email" placeholder="you@college.edu" required>
        </p>

        <!-- pattern allows exactly 10 digits, title is the error message -->
        <p>
            <input type="text" name="mobile" placeholder="10-digit mobile" pattern="[0-9]{10}" title="Enter exactly 10 digits" required>
        </p>

        <!-- minlength needs at least 6 characters -->
        <p>
            <input type="password" name="password" placeholder="Min 6 characters" minlength="6" required>
        </p>

        <!-- min and max limit the number between 17 and 30 -->
        <p>
            <input type="number" name="age" placeholder="Age (17-30)" min="17" max="30" required>
        </p>

        <button type="submit">Register</button>
    </form>
</body>
</html>
