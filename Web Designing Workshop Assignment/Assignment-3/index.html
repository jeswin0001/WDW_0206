<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 3 - Block and Inline Elements</title>
    <style>
        /* Block elements: start on a new line and take the full width */
        div {
            background-color: lightblue;
            margin: 4px 0;
            padding: 2px 4px;
        }

        /* Inline elements: stay on the same line and take only the needed width */
        span {
            background-color: lightgreen;
        }
    </style>
</head>
<body>
    <!-- Block elements -->
    <div>Block 1</div>
    <div>Block 2</div>

    <!-- Inline elements -->
    <span>Inline 1</span>
    <span>Inline 2</span>
    <span>Inline 3</span>
</body>
</html>
