<!DOCTYPE html>
<html lang="en">
<head>
    <title>Assignment 9 - Quotation and Citation Elements</title>
</head>
<body>
    <!-- Long quotation -->
    <blockquote>The best way to predict the future is to create it.</blockquote>

    <!-- Short quotation -->
    <p>As he said, <q>Stay hungry, stay foolish.</q></p>

    <!-- Title of a work -->
    <p>Book: <cite>The Pragmatic Programmer</cite></p>

    <!-- Abbreviation: hover to see the full form -->
    <p><abbr title="World Wide Web Consortium">W3C</abbr> sets web standards.</p>

    <!-- Contact information -->
    <address>
        Contact: Admin Office<br>
        College Road, Delhi
    </address>

    <!-- Deleted and inserted text -->
    <p><del>Old price 500</del> <ins>New price 400</ins></p>
</body>
</html>
