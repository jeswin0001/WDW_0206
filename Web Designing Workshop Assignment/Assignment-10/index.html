<!DOCTYPE html>
<html lang="en">
<head>
    <title>Assignment 10 - Multimedia: Image, Video, Audio and YouTube</title>
</head>
<body>
    <!-- Image -->
    <h3>Image</h3>
    <img src="college.jpg" alt="College campus" width="200" height="200">

    <!-- Video -->
    <h3>Video</h3>
    <video controls width="300">
        <source src="../../MidTerm-1%20Assessment/college.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <!-- Audio -->
    <h3>Audio</h3>
    <audio controls>
        <source src="../../MidTerm-1%20Assessment/song.mp3" type="audio/mpeg">
        Your browser does not support the audio tag.
    </audio>

    <!-- YouTube video using iframe -->
    <h3>YouTube</h3>
    <iframe width="400" height="250" src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="YouTube video" allowfullscreen></iframe>
</body>
</html>
