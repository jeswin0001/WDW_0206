<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exp-5</title>
</head>
<body>

<h1 align="center">Student Registration Form</h1></center>

<form action="#" method="post">

<label for="name">Full Name:</label>
<input type="text" id="name" placeholder="Enter your full name" required>
<br><br>

<label for="email">Email:</label>
<input type="email" id="email" placeholder="Enter valid email address" required>
<br><br>

<label for="password">Password:</label>
<input type="password" id="password" placeholder="Enter password" required>
<br><br>

<label>Gender:</label>
<input type="radio" id="male" name="gender" required>
<label for="male">Male</label>

<input type="radio" id="female" name="gender">
<label for="female">Female</label>

<input type="radio" id="other" name="gender">
<label for="other">Other</label>
<br><br>

<label for="course">Course:</label>
<select id="course" required>
    <option value="">-- Select Course --</option>
    <option value="btech">B.Tech</option>
    <option value="bca">BCA</option>
    <option value="bsc">B.Sc</option>
    <option value="bcom">B.Com</option>
    <option value="mca">MCA</option>
</select>
<br><br>

<label for="phone">Contact No:</label>
<input type="tel" id="phone" placeholder="Enter phone number" required>
<br><br>

<label for="address">Address:</label>
<br>
<textarea id="address" rows="5" cols="50" placeholder="Enter your address"></textarea>
<br><br>

<input type="submit" value="Register">
<input type="reset" value="Clear">

</form>

<hr>

<center>
    <p>&copy; 2025 Student Registration Portal</p>
</center>

</body>
</html>
